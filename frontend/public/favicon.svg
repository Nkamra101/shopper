<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Ink tile that inverts in dark mode so the mark never disappears. -->
  <style>
    .tile { fill: #111113; }
    .mark { stroke: #ffffff; }
    @media (prefers-color-scheme: dark) {
      .tile { fill: #f5f5f7; }
      .mark { stroke: #0a0a0c; }
    }
  </style>
  <rect class="tile" width="32" height="32" rx="8" />
  <g class="mark" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="16" cy="16" r="8" />
    <path d="M12.8 16.3l2.3 2.3 4.2-5" />
  </g>
</svg>
